<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lib/prism-catppuccin-mocha.css" />
</head>
<body>

  <div id="app">

    <!-- ── Toolbar (also serves as drag handle) ─────────────────────────────── -->
    <div id="toolbar">

      <!-- Left: new + delete -->
      <div class="toolbar-cluster" id="cluster-actions">
        <button id="btn-new"    class="icon-btn" title="New note (Ctrl+N)">
          <span aria-hidden="true">+</span>
        </button>
        <button id="btn-delete" class="icon-btn" title="Delete current note">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
          </svg>
        </button>
      </div>

      <!-- Centre: B / I / U / S pill -->
      <div class="toolbar-cluster" id="cluster-format">
        <button class="fmt-btn" data-cmd="bold"          title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="fmt-btn" data-cmd="italic"        title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="fmt-btn" data-cmd="underline"     title="Underline (Ctrl+U)"><u>U</u></button>
        <button class="fmt-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
        <button id="btn-color" class="color-btn" title="Text color" aria-haspopup="true">
          <span class="color-btn-a">A</span><span id="color-swatch-bar"></span>
        </button>
      </div>

      <!-- Right: font size + search + sidebar toggle + close -->
      <div class="toolbar-cluster" id="cluster-right">
        <input id="font-size" type="number" value="14" min="8" max="72"
               title="Font size" aria-label="Font size" />
        <button id="btn-search" class="icon-btn" title="Find in note (Ctrl+F)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button id="btn-sidebar" class="icon-btn" title="Toggle notes list">
          <svg width="14" height="12" viewBox="0 0 14 12" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <line x1="1" y1="1"  x2="13" y2="1"/>
            <line x1="1" y1="6"  x2="13" y2="6"/>
            <line x1="1" y1="11" x2="13" y2="11"/>
          </svg>
        </button>
        <button id="btn-minimize" class="icon-btn" title="Minimize">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true">
            <line x1="2" y1="6" x2="10" y2="6"/>
          </svg>
        </button>
        <button id="btn-maximize" class="icon-btn" title="Maximize">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"
               stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="1.5" y="1.5" width="8" height="8" rx="1.5"/>
          </svg>
        </button>
        <button id="btn-close" class="icon-btn close-btn" title="Close window">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true">
            <line x1="2" y1="2" x2="10" y2="10"/>
            <line x1="10" y1="2" x2="2" y2="10"/>
          </svg>
        </button>
      </div>

    </div><!-- /toolbar -->

    <!-- ── Text color palette — hidden until #btn-color is clicked ────────────── -->
    <div id="color-popover" aria-hidden="true">
      <button class="color-sw" data-color="#ff6b6b" title="Red"    style="background:#ff6b6b"></button>
      <button class="color-sw" data-color="#ffa94d" title="Orange" style="background:#ffa94d"></button>
      <button class="color-sw" data-color="#ffd43b" title="Yellow" style="background:#ffd43b"></button>
      <button class="color-sw" data-color="#69db7c" title="Green"  style="background:#69db7c"></button>
      <button class="color-sw" data-color="#4dabf7" title="Blue"   style="background:#4dabf7"></button>
      <button class="color-sw" data-color="#b197fc" title="Purple" style="background:#b197fc"></button>
      <button class="color-sw" data-color="#f783ac" title="Pink"   style="background:#f783ac"></button>
      <button class="color-sw color-sw-clear" data-color="" title="Default color">✕</button>
      <input id="color-custom" type="color" value="#ff6b6b" title="Custom color" aria-label="Custom color" />
    </div>

    <!-- ── Search bar — hidden until Ctrl+F or 🔍 clicked ───────────────────── -->
    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Find in note…"
             autocomplete="off" spellcheck="false" aria-label="Search" />
      <span id="search-count"></span>
      <button id="search-prev" class="search-nav-btn" title="Previous match (Shift+Enter)">↑</button>
      <button id="search-next" class="search-nav-btn" title="Next match (Enter)">↓</button>
      <button id="search-close" class="search-nav-btn" title="Close (Escape)">×</button>
    </div>

    <!-- ── Main area (editor + sidebar side by side) ──────────────────────── -->
    <div id="main-area">

      <div id="editor"
           contenteditable="true"
           spellcheck="true"
           data-placeholder="Start typing…"
           role="textbox"
           aria-multiline="true"
           aria-label="Note editor"></div>

      <!-- Sidebar — hidden by default, toggled with #btn-sidebar -->
      <div id="sidebar">
        <div id="sidebar-header">All Notes</div>
        <div id="notes-list">
          <!-- Populated by renderer.js -->
        </div>
      </div>

    </div><!-- /main-area -->

    <!-- ── Tab bar — shows opened notes ──────────────────────────────────── -->
    <div id="tab-bar">
      <!-- Populated by renderer.js -->
    </div>

    <!-- ── Status bar ─────────────────────────────────────────────────────── -->
    <div id="status-bar">
      <span id="status-text" title="Click to toggle Always on Top">● Always on Top</span>
    </div>

  </div><!-- /app -->

  <!-- ── Right-click context menu ─────────────────────────────────────────── -->
  <div id="context-menu" aria-hidden="true">
    <div id="ctx-format-row">
      <button class="ctx-fmt-btn" data-cmd="bold"          title="Bold"><b>B</b></button>
      <button class="ctx-fmt-btn" data-cmd="italic"        title="Italic"><i>I</i></button>
      <button class="ctx-fmt-btn" data-cmd="underline"     title="Underline"><u>U</u></button>
      <button class="ctx-fmt-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
    </div>
    <div class="ctx-divider"></div>
    <div id="ctx-highlight-row" class="ctx-highlight-row">
      <span class="ctx-highlight-label">Highlight</span>
      <button class="ctx-hl-btn" data-color="#7a6520" title="Yellow" style="background:#7a6520;"></button>
      <button class="ctx-hl-btn" data-color="#8c3a2a" title="Red" style="background:#8c3a2a;"></button>
      <button class="ctx-hl-btn" data-color="#2e6b3a" title="Green" style="background:#2e6b3a;"></button>
      <button class="ctx-hl-btn" data-color="#2a5580" title="Blue" style="background:#2a5580;"></button>
      <button class="ctx-hl-btn" data-color="#6b3a80" title="Purple" style="background:#6b3a80;"></button>
      <button class="ctx-hl-btn ctx-hl-clear" data-color="" title="Remove highlight">✕</button>
    </div>
    <div id="ctx-color-row" class="ctx-highlight-row">
      <span class="ctx-highlight-label">Color</span>
      <button class="ctx-col-btn" data-color="#ff6b6b" title="Red" style="background:#ff6b6b;"></button>
      <button class="ctx-col-btn" data-color="#ffa94d" title="Orange" style="background:#ffa94d;"></button>
      <button class="ctx-col-btn" data-color="#ffd43b" title="Yellow" style="background:#ffd43b;"></button>
      <button class="ctx-col-btn" data-color="#69db7c" title="Green" style="background:#69db7c;"></button>
      <button class="ctx-col-btn" data-color="#4dabf7" title="Blue" style="background:#4dabf7;"></button>
      <button class="ctx-col-btn" data-color="#b197fc" title="Purple" style="background:#b197fc;"></button>
      <button class="ctx-col-btn" data-color="#f783ac" title="Pink" style="background:#f783ac;"></button>
      <button class="ctx-col-btn ctx-hl-clear" data-color="" title="Default color">✕</button>
    </div>
    <div class="ctx-divider"></div>
    <button class="ctx-item" id="ctx-copy">Copy</button>
    <button class="ctx-item" id="ctx-cut">Cut</button>
    <button class="ctx-item" id="ctx-paste">Paste</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" id="ctx-spellcheck">✓ Spell Check</button>
  </div>

  <script src="lib/prism-bundle.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
